nl:
  naam: Aan de rivier
  onder: Rio Mondego
  tekst: |-
    De Mondego ontspringt hogerop in de Serra da Estrela en slingert hier door een diepe vallei.

    In de zomer is het water helder en koud. Het is de plek om af te koelen na een dag werken.
