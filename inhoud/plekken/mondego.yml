pt:
  naam: Junto ao rio
  onder: Rio Mondego
  tekst: |-
    O Mondego nasce mais acima, na Serra da Estrela, e serpenteia aqui por um vale profundo.

    No verão a água é límpida e fria. É o sítio para refrescar depois de um dia de trabalho.
  nog_schrijven: false
en:
  naam: By the river
  onder: Rio Mondego
  tekst: |-
    The Mondego rises higher up in the Serra da Estrela and winds through a deep valley here.

    In summer the water is clear and cold. It is the place to cool off after a day of work.
  nog_schrijven: false
