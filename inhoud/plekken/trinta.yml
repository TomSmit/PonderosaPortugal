nl:
  naam: Trinta
  onder: Het dorp
  tekst: >-
    Boven op de helling ligt Trinta. Iedereen kent hier iedereen.


    Hier leer je de mensen kennen die al hun hele leven in de vallei wonen. Een
    praatje op het plein hoort erbij, ook als je nog geen Portugees spreekt.
  nog_schrijven: false
pt:
  naam: Trinta
  onder: A aldeia
  tekst: >-
    No alto da encosta fica Trinta. Aqui toda a gente se conhece.


    Aqui os jovens conhecem quem viveu a vida inteira no vale. Uma conversa na
    praça faz parte, mesmo sem saber ainda falar português.
  nog_schrijven: false
en:
  naam: Trinta
  onder: The village
  tekst: >-
    At the top of the slope lies Trinta. Everyone knows everyone here.


    Here you meet people who have lived in the valley all their lives. A chat on
    the square is part of it, even if you do not speak Portuguese yet.
  nog_schrijven: false
