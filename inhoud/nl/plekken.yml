# Het verhaal van elke plek op de kaart. Elke regel onder "tekst" is een alinea.
# Staat er "nog_schrijven: true", dan ziet de bezoeker dat het verhaal nog volgt. Haal die regel weg als de tekst af is.
quinta:
  naam: Quinta Dionisio
  onder: Het hart van de zomer
  tekst:
  - Hier woon je. Een quinta op de helling, vlak boven de rivier. Vroeger was het een roggemolen.
  - Er is stromend water en een beetje stroom, en wat er moet gebeuren doe je samen.
theater:
  naam: Het theater
  onder: Op de quinta
  tekst:
  - Het theater op de quinta, aan de bovenkant van het terrein.
  nog_schrijven: true
mirjam:
  naam: Het huis van Mirjam
  onder: Op de quinta
  tekst:
  - Hier woont Mirjam, op de quinta.
  nog_schrijven: true
buitenkeuken:
  naam: De buitenkeuken
  onder: Op de quinta
  tekst:
  - De buitenkeuken op de quinta, waar de groep samen kookt.
  nog_schrijven: true
rio:
  naam: Aan de rivier
  onder: Rio Mondego
  tekst:
  - De Mondego ontspringt hogerop in de Serra da Estrela en slingert hier door een diepe vallei.
  - In de zomer is het water helder en koud. Het is de plek om af te koelen na een dag werken.
engenhogrande:
  naam: Engenho Grande
  onder: Fábrica de Marrocos
  tekst:
  - De ruïne van een oude wolfabriek aan de Mondego, ten westen van de quinta. Langs deze rivier draaiden vroeger watermolens en wolfabrieken op de kracht van het water.
videmonte:
  naam: Videmonte
  onder: Het dorp aan het eind van de route
  tekst:
  - In het westen ligt Videmonte, op de helling boven de rivier.
  - Hier eindigen de Passadiços do Mondego. Wie de hele route loopt, komt hier na zo'n 12 kilometer aan.
trinta:
  naam: Trinta
  onder: Het dorp
  tekst:
  - Boven op de helling ligt Trinta. Iedereen kent hier iedereen.
  - Hier leer je de mensen kennen die al hun hele leven in de vallei wonen. Een praatje op het plein hoort erbij, ook als je nog geen Portugees spreekt.
cafe:
  naam: Cafe Central
  onder: Café in Trinta
  tekst:
  - Het café aan het plein van Trinta.
  nog_schrijven: true
bakker:
  naam: De bakker
  onder: Trinta
  tekst:
  - De bakker van Trinta.
  nog_schrijven: true
huisrui:
  naam: Rui, Tina en Cidalia
  onder: Trinta
  tekst:
  - Hier wonen Rui, Tina en Cidalia.
  nog_schrijven: true
miradouro:
  naam: Passadiços do Mondego
  onder: Miradouro do Alto Mondego
  tekst:
  - 'Langs de rivier lopen de Passadiços do Mondego: zo''n 12 kilometer houten paden en hangbruggen, van de dam van het Caldeirão tot Videmonte.'
  - Vanaf dit uitkijkpunt zie je de bocht van de rivier. Soms lopen we een stuk van de route, en wie wil kan een keer helemaal tot Videmonte.
levada:
  naam: Levada do Pateiro
  onder: Oud waterkanaal
  tekst:
  - Een oud waterkanaal langs de rivier, met een klein stuwtje en een oude waterkrachtcentrale.
vilasoeiro:
  naam: Vila Soeiro
  onder: Dorp aan de Mondego
  tekst:
  - Een klein dorp aan de rivier, ten noorden van de quinta.
  - Hier is een tussenentree van de Passadiços do Mondego. Vlakbij liggen de resten van oude fabrieken die op het water van de rivier draaiden.
ponte:
  naam: Ponte da Mizarela
  onder: Middeleeuwse brug
  tekst:
  - Een middeleeuwse brug over de Mondego, bij Vila Soeiro. De Passadiços do Mondego komen erlangs.
cascata:
  naam: Cascata do Caldeirão
  onder: Waterval bij de dam
  tekst:
  - Een waterval vlak bij de dam van het stuwmeer, met een uitkijkplatform.
barragem:
  naam: Barragem do Caldeirão
  onder: Stuwmeer en dam
  tekst:
  - In het oosten ligt het stuwmeer van het Caldeirão, met de dam aan de noordkant. Vlak bij de dam valt de Cascata do Caldeirão.
  - Bij de dam begint de wandelroute langs de Mondego.
bar:
  naam: De bar bij het stuwmeer
  onder: Aan het Caldeirão
  tekst:
  - Aan de oever van het stuwmeer, vlak bij de zwemplek.
  nog_schrijven: true
praia:
  naam: Praia Fluvial
  onder: Zwemplek aan het stuwmeer
  tekst:
  - De zwemplek aan het stuwmeer van het Caldeirão.
  nog_schrijven: true
